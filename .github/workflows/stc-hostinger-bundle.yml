name: STC Hostinger Hotfix Bundle

on:
  push:
    branches: [main]
    paths:
      - "ops/HOSTINGER_BUNDLE_TRIGGER"
      - ".github/workflows/stc-hostinger-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stc-hostinger-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build Hostinger hotfix package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/stc-hostinger-dual-competition
          for file in \
            approval.php \
            cloud_control.php \
            notification_control.php \
            operator.php \
            operator_snapshot.php \
            portfolio_control.php \
            position.php
          do
            cp "hostinger_patch/${file}" "out/stc-hostinger-dual-competition/${file}"
          done
          cat > out/stc-hostinger-dual-competition/UPLOAD_README.txt <<'EOF'
          STC Hostinger dual-competition release
          =================================
          Upload these seven PHP files to the existing STC public_html directory.
          Replace the files with the same names.

          Files:
          - approval.php
          - cloud_control.php
          - notification_control.php
          - operator.php
          - operator_snapshot.php
          - portfolio_control.php
          - position.php

          Do NOT upload config.php and do not change credentials.
          No SQL migration is required for this hotfix.
          This hotfix does not add automatic broker execution.
          It includes:
          - Telegram/server-to-console notification visibility parity;
          - approval-time MAX STC QUANTITY and duplicate/re-entry guardrails;
          - audited VOID support for mistaken manual_external ledger rows;
          - research-only gate supply audit for both Capital and AMP Futures;
          - shared Capital/AMP COMPETITION_OPPORTUNITY eligibility parity;
          - closed-bar high-water profit protection for open positions.

          After upload:
          1. STC Live Readback must verify the deployed runtime;
          2. reconcile STC OPEN positions to the competition platform before
             trusting portfolio-management alerts;
          3. verify Telegram/server events appear in the owner console;
          4. verify position-management messages expose current R, peak R and
             locked R floor when profit protection is active;
          5. verify the competition gate audit contains separate Capital and
             AMP Futures buckets after this package is deployed.
          EOF
          (
            cd out
            zip -qr stc-hostinger-dual-competition.zip stc-hostinger-dual-competition
          )
          sha256sum out/stc-hostinger-dual-competition.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stc-hostinger-dual-competition-${{ github.run_id }}
          path: out/stc-hostinger-dual-competition.zip
          if-no-files-found: error
          retention-days: 30
