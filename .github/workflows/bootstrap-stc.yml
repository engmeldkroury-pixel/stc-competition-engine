name: Bootstrap STC v0.5

on:
  push:
    paths:
      - ".github/workflows/bootstrap-stc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and unpack STC v0.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bootstrap_unpack
          cat bootstrap/STC_APP_v0_5.zip.b64 \
              bootstrap/STC_APP_v0_5.zip.b64.part01a \
              bootstrap/STC_APP_v0_5.zip.b64.part01b \
              bootstrap/STC_APP_v0_5.zip.b64.part02 \
              bootstrap/STC_APP_v0_5.zip.b64.part03 \
              bootstrap/STC_APP_v0_5.zip.b64.part04 \
              > .bootstrap_unpack/stc.b64
          base64 -d .bootstrap_unpack/stc.b64 > .bootstrap_unpack/stc.zip
          echo "d10d66b862791c45f9327e79714efc7292ac14eee5fb368da041e5d80b82139e  .bootstrap_unpack/stc.zip" | sha256sum -c -
          unzip -q .bootstrap_unpack/stc.zip -d .bootstrap_unpack/unpacked
          shopt -s dotglob nullglob
          cp -a .bootstrap_unpack/unpacked/STC_APP_v0_5/. ./
          rm -rf .bootstrap_unpack bootstrap
          git checkout -- .github/workflows/bootstrap-stc.yml

      - name: Commit installed source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install STC Competition Engine v0.5"
          git push
