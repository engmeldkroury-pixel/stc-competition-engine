name: STC Live Readback

on:
  push:
    branches: [main]
    paths:
      - "ops/LIVE_READBACK_TRIGGER"
      - ".github/workflows/stc-live-readback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stc-live-readback
  cancel-in-progress: true

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STC_OWNER_TOKEN: ${{ secrets.STC_OWNER_TOKEN }}
    steps:
      - name: Read sanitized production snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STC_OWNER_TOKEN:-}" ]; then
            echo "STC_OWNER_TOKEN is not configured"
            exit 2
          fi
          curl -fsS --retry 2 --max-time 20 \
            -H "Authorization: Bearer ${STC_OWNER_TOKEN}" \
            "https://stc.feama.site/operator_snapshot.php" > /tmp/stc_snapshot.json
          curl -fsS --retry 2 --max-time 20 \
            -H "Authorization: Bearer ${STC_OWNER_TOKEN}" \
            "https://stc.feama.site/notification.php" > /tmp/stc_notifications.json
          python - <<'PY'
          import json

          data = json.load(open("/tmp/stc_snapshot.json", encoding="utf-8"))
          cards = []
          for card in data.get("cards") or []:
              if card.get("competition_id") != "capital-africa-sep-2026":
                  continue
              cards.append({
                  "symbol": card.get("symbol"),
                  "source_time": card.get("source_time"),
                  "recommendation": card.get("recommendation"),
                  "pre_gate_recommendation": card.get("pre_gate_recommendation"),
                  "setup_grade": card.get("setup_grade"),
                  "setup_quality_score": card.get("setup_quality_score"),
                  "quality_gate_passed_live_php": card.get("quality_gate_passed"),
                  "quality_gate_failures": card.get("quality_gate_failures"),
                  "composite_score": card.get("composite_score"),
                  "timeframe_confirmation": card.get("timeframe_confirmation"),
                  "live_family_evidence": card.get("live_family_evidence"),
                  "research_calibration": card.get("research_calibration"),
                  "locked_plan_present_live_php": card.get("locked_trade_plan") is not None,
                  "opportunity_active_live_php": card.get("opportunity_active"),
                  "has_open_position": card.get("has_open_position"),
              })
          cards.sort(key=lambda row: row.get("symbol") or "")
          print("STC_LIVE_CAPITAL_SIGNAL_READBACK=" + json.dumps(cards, sort_keys=True))

          amp_cards = []
          for card in data.get("cards") or []:
              if card.get("competition_id") != "amp-futures-sep-2026":
                  continue
              amp_cards.append({
                  "symbol": card.get("symbol"),
                  "source_time": card.get("source_time"),
                  "recommendation": card.get("recommendation"),
                  "pre_gate_recommendation": card.get("pre_gate_recommendation"),
                  "setup_grade": card.get("setup_grade"),
                  "setup_quality_score": card.get("setup_quality_score"),
                  "quality_gate_passed_live_php": card.get("quality_gate_passed"),
                  "quality_gate_failures": card.get("quality_gate_failures"),
                  "timeframe_confirmation": card.get("timeframe_confirmation"),
                  "live_family_evidence": card.get("live_family_evidence"),
                  "research_calibration": card.get("research_calibration"),
                  "locked_plan_present_live_php": card.get("locked_trade_plan") is not None,
                  "opportunity_active_live_php": card.get("opportunity_active"),
                  "has_open_position": card.get("has_open_position"),
                  "composite_score": card.get("composite_score"),
              })
          amp_cards.sort(key=lambda row: row.get("symbol") or "")
          print("STC_LIVE_AMP_SIGNAL_READBACK=" + json.dumps(amp_cards, sort_keys=True))

          active = []
          for card in data.get("cards") or []:
              if card.get("competition_id") != "capital-africa-sep-2026":
                  continue
              if card.get("opportunity_active") is not True:
                  continue
              active.append({
                  "event_id": card.get("event_id"),
                  "signal_id": card.get("signal_id"),
                  "symbol": card.get("symbol"),
                  "source_time": card.get("source_time"),
                  "current_price_from_confirmed_bar": card.get("current_price"),
                  "recommendation": card.get("recommendation"),
                  "setup_grade": card.get("setup_grade"),
                  "setup_quality_score": card.get("setup_quality_score"),
                  "expires_in_seconds": card.get("expires_in_seconds"),
                  "envelope": card.get("envelope"),
                  "locked_trade_plan": card.get("locked_trade_plan"),
                  "position_sizing": card.get("position_sizing"),
                  "order_instruction": card.get("order_instruction"),
                  "macro_context": card.get("macro_context"),
                  "manual_execution_ready": card.get("manual_execution_ready"),
                  "approval": card.get("approval"),
              })
          print("STC_LIVE_ACTIVE_OPPORTUNITIES=" + json.dumps(active, sort_keys=True))
          print("STC_LIVE_RUNTIME_CONTROL=" + json.dumps(data.get("runtime_control") or {}, sort_keys=True))
          print("STC_LIVE_COMPETITION_GATE_AUDIT=" + json.dumps(data.get("competition_gate_audit") or {}, sort_keys=True))
          positions = []
          for p in ((data.get("portfolio") or {}).get("positions") or []):
              positions.append({
                  "position_id": p.get("position_id"),
                  "competition_id": p.get("competition_id"),
                  "symbol": p.get("symbol"),
                  "side": p.get("side"),
                  "quantity": p.get("quantity"),
                  "entry_price": p.get("entry_price"),
                  "current_stop": p.get("current_stop"),
                  "target1": p.get("target1"),
                  "target2": p.get("target2"),
                  "opened_at_utc": p.get("opened_at_utc"),
                  "status": p.get("status"),
              })
          print("STC_LIVE_OPEN_POSITIONS=" + json.dumps(positions, sort_keys=True))
          print(
              "STC_LIVE_COMPETITION_PROGRESS="
              + json.dumps(
                  (data.get("competition_progress") or {}).get("capital-africa-sep-2026") or {},
                  sort_keys=True,
              )
          )
          print(
              "STC_LIVE_AMP_COMPETITION_PROGRESS="
              + json.dumps(
                  (data.get("competition_progress") or {}).get("amp-futures-sep-2026") or {},
                  sort_keys=True,
              )
          )

          notifications = json.load(open("/tmp/stc_notifications.json", encoding="utf-8"))
          config = notifications.get("config") or {}
          events = notifications.get("events") or []
          deliveries = notifications.get("deliveries") or []
          from collections import Counter, defaultdict
          capital_events = [
              e for e in events
              if e.get("competition_id") == "capital-africa-sep-2026"
          ]
          symbol_event_counts = Counter(
              (e.get("symbol") or "NONE", e.get("event_type") or "UNKNOWN")
              for e in capital_events
          )
          by_symbol = defaultdict(lambda: {"total": 0, "NEW_LOCKED_PLAN": 0, "POSITION_MANAGEMENT": 0})
          for e in capital_events:
              sym = e.get("symbol") or "NONE"
              typ = e.get("event_type") or "UNKNOWN"
              by_symbol[sym]["total"] += 1
              if typ in by_symbol[sym]:
                  by_symbol[sym][typ] += 1
          print("STC_LIVE_NOTIFICATION_SYMBOL_COUNTS=" + json.dumps(dict(sorted(by_symbol.items())), sort_keys=True))
          amp_events = [
              e for e in events
              if e.get("competition_id") == "amp-futures-sep-2026"
          ]
          amp_by_symbol = defaultdict(lambda: {"total": 0, "NEW_LOCKED_PLAN": 0, "POSITION_MANAGEMENT": 0})
          for e in amp_events:
              sym = e.get("symbol") or "NONE"
              typ = e.get("event_type") or "UNKNOWN"
              amp_by_symbol[sym]["total"] += 1
              if typ in amp_by_symbol[sym]:
                  amp_by_symbol[sym][typ] += 1
          print("STC_LIVE_AMP_NOTIFICATION_SYMBOL_COUNTS=" + json.dumps(dict(sorted(amp_by_symbol.items())), sort_keys=True))
          print("STC_LIVE_NOTIFICATION_CONFIG=" + json.dumps(config, sort_keys=True))
          print(
              "STC_LIVE_NOTIFICATION_RECENT="
              + json.dumps(
                  {
                      "events": [
                          {
                              "notification_id": e.get("notification_id"),
                              "event_type": e.get("event_type"),
                              "competition_id": e.get("competition_id"),
                              "symbol": e.get("symbol"),
                              "severity": e.get("severity"),
                              "created_at_utc": e.get("created_at_utc"),
                          }
                          for e in events[:10]
                      ],
                      "deliveries": [
                          {
                              "notification_id": d.get("notification_id"),
                              "channel": d.get("channel"),
                              "status": d.get("status"),
                              "http_code": d.get("http_code"),
                              "error_text": d.get("error_text"),
                              "attempted_at_utc": d.get("attempted_at_utc"),
                          }
                          for d in deliveries[:20]
                      ],
                  },
                  sort_keys=True,
              )
          )
          PY
