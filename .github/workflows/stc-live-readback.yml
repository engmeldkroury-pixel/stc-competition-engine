name: STC Live Acceptance Readback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stc-live-readback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STC_BRIDGE_URL: https://stc.feama.site
      STC_WORKER_TOKEN: ${{ secrets.STC_WORKER_TOKEN }}
    steps:
      - name: Read sanitized ingested signal evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          base = os.environ["STC_BRIDGE_URL"].rstrip("/")
          token = os.environ["STC_WORKER_TOKEN"]
          url = base + "/inbox.php?" + urllib.parse.urlencode({"status": "ingested", "limit": 100})
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=15) as resp:
              body = json.load(resp)

          events = body.get("events") or []
          rows = []
          for item in events:
              payload = item.get("payload") or {}
              result = item.get("result") or {}
              decision = result.get("decision") or {}
              signal = decision.get("signal") or {}
              plan = decision.get("locked_trade_plan")
              if payload.get("competition_id") != "capital-africa-sep-2026":
                  continue
              if str(payload.get("time") or "") < "2026-09-21T14:00:00":
                  continue
              reasons = signal.get("reasons") or []
              rows.append({
                  "event_id": item.get("event_id"),
                  "status": item.get("status"),
                  "symbol": payload.get("symbol"),
                  "time": payload.get("time"),
                  "history_complete": all(payload.get(k) is not None for k in (
                      "history_timeframe","history_time","history_close","history_ema50","history_ema200",
                      "history_rsi14","history_atr14","history_high_252","history_low_252",
                      "history_momentum_20","history_momentum_63","history_momentum_126",
                      "history_momentum_252","history_volatility_20"
                  )),
                  "recommendation": signal.get("recommendation"),
                  "historical_reason": next((r for r in reasons if str(r).startswith("historical_regime=")), None),
                  "blended_reason": next((r for r in reasons if str(r).startswith("blended_technical=")), None),
                  "plan_id": plan.get("plan_id") if isinstance(plan, dict) else None,
                  "plan_locked": plan.get("levels_locked") if isinstance(plan, dict) else None,
                  "execution": plan.get("execution") if isinstance(plan, dict) else decision.get("execution"),
              })

          print(json.dumps({"count": len(rows), "rows": rows}, indent=2, sort_keys=True))
          PY
