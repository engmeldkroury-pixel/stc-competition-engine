name: STC Private Config Audit

on:
  push:
    branches: [stc-private-config-audit-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      STC_OWNER_TOKEN: ${{ secrets.STC_OWNER_TOKEN }}
    steps:
      - name: Read sanitized runtime snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("STC_OWNER_TOKEN", "")
          if not token:
              raise SystemExit("STC_OWNER_TOKEN missing")

          def get(path):
              req = urllib.request.Request(
                  "https://stc.feama.site/" + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "User-Agent": "STC-Private-Config-Audit/1.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.load(response)

          notification = get("notification.php")
          snapshot = get("operator_snapshot.php")

          deliveries = notification.get("deliveries") or []
          status_counts = {}
          for item in deliveries:
              status = str(item.get("status") or "unknown")
              status_counts[status] = status_counts.get(status, 0) + 1

          cards = []
          for card in snapshot.get("cards") or []:
              if card.get("competition_id") != "capital-africa-sep-2026":
                  continue
              cards.append({
                  "symbol": card.get("symbol"),
                  "source_time": card.get("source_time"),
                  "recommendation": card.get("recommendation"),
                  "pre_gate_recommendation": card.get("pre_gate_recommendation"),
                  "setup_grade": card.get("setup_grade"),
                  "setup_quality_score": card.get("setup_quality_score"),
                  "quality_gate_passed": card.get("quality_gate_passed"),
                  "opportunity_active": card.get("opportunity_active"),
                  "manual_execution_ready": card.get("manual_execution_ready"),
                  "has_locked_plan": isinstance(card.get("locked_trade_plan"), dict),
                  "quality_gate_failures": card.get("quality_gate_failures") or [],
              })

          print(json.dumps({
              "notification_config": notification.get("config") or {},
              "delivery_status_counts": status_counts,
              "runtime": snapshot.get("runtime_control") or {},
              "capital_cards": cards,
          }, sort_keys=True))
          PY
