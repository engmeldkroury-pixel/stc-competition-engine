name: STC Private Config Audit

on:
  push:
    branches: [stc-private-config-audit-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      STC_WORKER_TOKEN: ${{ secrets.STC_WORKER_TOKEN }}
    steps:
      - name: Retry current EURUSD plan notification safely
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("STC_WORKER_TOKEN", "")
          if not token:
              raise SystemExit("STC_WORKER_TOKEN missing")

          event_id = "capital-africa-sep-2026|CAPITALCOM:EURUSD|15|1790245800000"
          body = json.dumps({"action": "signal", "event_id": event_id}).encode()
          req = urllib.request.Request(
              "https://stc.feama.site/notification.php",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "STC-Private-Config-Audit/1.0",
              },
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              data = json.load(response)

          dispatch = data.get("dispatch") or {}
          channels = dispatch.get("channels") or {}
          sanitized_channels = {}
          for name, item in channels.items():
              if isinstance(item, dict):
                  sanitized_channels[name] = {
                      "attempted": item.get("attempted"),
                      "ok": item.get("ok"),
                      "status": item.get("status"),
                      "http_code": item.get("http_code"),
                  }

          print(json.dumps({
              "event_id": event_id,
              "ok": data.get("ok"),
              "skipped": data.get("skipped"),
              "reason": data.get("reason"),
              "delivered_any": dispatch.get("delivered_any"),
              "channels": sanitized_channels,
          }, sort_keys=True))
          PY
