name: STC Loss Plan Audit

on:
  push:
    branches: ["ops/xag-plan-audit-20260924"]
    paths:
      - ".github/workflows/stc-xag-plan-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STC_OWNER_TOKEN: ${{ secrets.STC_OWNER_TOKEN }}
    steps:
      - name: Read sanitized loss-trade notification plans
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STC_OWNER_TOKEN:-}"
          curl -fsS --retry 2 --max-time 20 \
            -H "Authorization: Bearer ${STC_OWNER_TOKEN}" \
            "https://stc.feama.site/notification.php" > /tmp/notifications.json
          curl -fsS --retry 2 --max-time 20 \
            -H "Authorization: Bearer ${STC_OWNER_TOKEN}" \
            "https://stc.feama.site/position.php?status=ALL&competition_id=capital-africa-sep-2026" > /tmp/positions.json
          python - <<'PY'
          import json, re
          data=json.load(open("/tmp/notifications.json",encoding="utf-8"))
          rows=[]
          target_symbols={"CAPITALCOM:XAGUSD","CAPITALCOM:BTCUSD","CAPITALCOM:ETHUSD","CAPITALCOM:SPX500","CAPITALCOM:EURUSD","CAPITALCOM:NAS100"}
          for e in data.get("events") or []:
              if e.get("event_type")!="NEW_LOCKED_PLAN" or e.get("symbol") not in target_symbols:
                  continue
              created=str(e.get("created_at_utc") or "")
              body=str(e.get("body_text") or "")
              def line(prefix):
                  for x in body.splitlines():
                      if x.startswith(prefix):
                          return x[len(prefix):].strip()
                  return None
              rows.append({
                  "created_at_utc":created,
                  "symbol":e.get("symbol"),
                  "event_key":e.get("event_key"),
                  "order":line("Order: "),
                  "quantity_line":line("Quantity: "),
                  "entry_zone":line("Entry zone: "),
                  "stop":line("Stop: "),
                  "final_take_profit":line("Final take profit: "),
                  "setup_quality":line("Setup quality: "),
                  "signal_score":line("Signal score: "),
                  "mtf":line("MTF: "),
                  "evidence_families":line("Evidence families: "),
              })
          print("STC_LOSS_PLAN_AUDIT="+json.dumps(rows,sort_keys=True))
          pdata=json.load(open("/tmp/positions.json",encoding="utf-8"))
          ps=[]
          for p in pdata.get("positions") or []:
              ps.append({
                  "position_id":p.get("position_id"),
                  "symbol":p.get("symbol"),
                  "side":p.get("side"),
                  "status":p.get("status"),
                  "origin":p.get("origin"),
                  "source_plan_id":p.get("source_plan_id"),
                  "source_signal_id":p.get("source_signal_id"),
                  "note":p.get("note"),
                  "initial_quantity":p.get("initial_quantity"),
                  "quantity":p.get("quantity"),
                  "entry_price":p.get("entry_price"),
                  "opened_at_utc":p.get("opened_at_utc"),
                  "closed_at_utc":p.get("closed_at_utc"),
                  "exit_price":p.get("exit_price"),
                  "realized_pnl_usd":p.get("realized_pnl_usd"),
              })
          print("STC_CAPITAL_POSITION_LEDGER="+json.dumps(ps,sort_keys=True))
          PY
