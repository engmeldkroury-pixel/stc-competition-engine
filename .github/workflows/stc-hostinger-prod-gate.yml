name: STC Hostinger Production Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stc-hostinger-prod-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STC_WORKER_TOKEN: ${{ secrets.STC_WORKER_TOKEN }}
      BRIDGE_URL: https://stc.feama.site
    steps:
      - name: Verify durable runtime control is fail-closed
        run: |
          set -euo pipefail
          test -n "$STC_WORKER_TOKEN"
          body="$(curl --fail-with-body -sS -H "Authorization: Bearer $STC_WORKER_TOKEN" "$BRIDGE_URL/runtime_control.php")"
          printf '%s' "$body" | jq -e '
            .ok == true
            and .runtime_control.safe_mode == true
            and .runtime_control.kill_switch == true
            and (.runtime_control.version | type == "number")
          ' >/dev/null
          printf '%s' "$body" | jq '{
            ok,
            runtime_control: {
              safe_mode: .runtime_control.safe_mode,
              kill_switch: .runtime_control.kill_switch,
              version: .runtime_control.version,
              updated_at_utc: .runtime_control.updated_at_utc
            }
          }'

      - name: Inspect durable signal availability and approval read path
        run: |
          set -euo pipefail
          inbox="$(curl --fail-with-body -sS -H "Authorization: Bearer $STC_WORKER_TOKEN" "$BRIDGE_URL/inbox.php?status=ingested&limit=100")"
          signal_id="$(printf '%s' "$inbox" | jq -r '
            [.events[]?
             | select((.result.status? == "analyzed") and (.result.decision.action? == "signal_created"))
             | .result.decision.signal.signal_id][0] // empty
          ')"
          count="$(printf '%s' "$inbox" | jq '
            [.events[]?
             | select((.result.status? == "analyzed") and (.result.decision.action? == "signal_created"))]
            | length
          ')"
          echo "persisted_analyzed_signal_count=$count"
          if [ -n "$signal_id" ]; then
            response="$(curl --fail-with-body -sS -H "Authorization: Bearer $STC_WORKER_TOKEN" --get --data-urlencode "signal_id=$signal_id" "$BRIDGE_URL/approval.php")"
            printf '%s' "$response" | jq -e '.ok == true and .execution == "manual_only"' >/dev/null
            printf '%s' "$response" | jq '{
              ok,
              signal_id,
              has_approval: (.approval != null),
              runtime_control: {
                safe_mode: .runtime_control.safe_mode,
                kill_switch: .runtime_control.kill_switch,
                version: .runtime_control.version
              },
              execution
            }'
          else
            code="$(curl -sS -o /tmp/approval-missing.json -w '%{http_code}' -H "Authorization: Bearer $STC_WORKER_TOKEN" --get --data-urlencode "signal_id=bridge-missing-production-gate" "$BRIDGE_URL/approval.php")"
            test "$code" = "404"
            jq -e '.error == "signal_not_found"' /tmp/approval-missing.json >/dev/null
            echo '{"approval_endpoint":"reachable_and_authenticated","signal_available":false}'
          fi
