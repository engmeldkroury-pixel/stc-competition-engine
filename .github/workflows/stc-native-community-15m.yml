name: STC Native + Community 15m Benchmark

on:
  push:
    branches:
      - "research/native-community-15m-*"
    paths:
      - "research_native_inputs/READY"

permissions:
  contents: read

concurrency:
  group: stc-native-community-15m-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.matrix.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          dirs="$(find research_native_inputs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "$dirs"

  benchmark:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one symbol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_native_outputs
          python scripts/run_native_community_15m.py "research_native_inputs/${{ matrix.dir }}" --output "research_native_outputs/${{ matrix.dir }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: stc-result-${{ matrix.dir }}
          path: research_native_outputs/*.json
          if-no-files-found: error
          retention-days: 14

  combine:
    needs: benchmark
    if: always() && needs.benchmark.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stc-result-*
          merge-multiple: true
          path: research_native_outputs
      - name: Build combined leaderboard
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows=[]
          indicator_stats={}
          native_stats={}
          for path in sorted(Path("research_native_outputs").glob("*.json")):
              d=json.loads(path.read_text())
              ens=d.get("ensemble_profile") or {}
              rows.append({
                  "symbol": d["symbol"],
                  "asset_class": d["asset_class"],
                  "native_status": (d.get("native_selection") or {}).get("status"),
                  "native_strategy": (d.get("native_selection") or {}).get("strategy_id"),
                  "native_score": (d.get("native_selection") or {}).get("robust_score"),
                  "ensemble_status": ens.get("status"),
                  "community_weight_share": ens.get("community_weight_share"),
                  "core_weight_share": ens.get("core_weight_share"),
                  "top_component": ((ens.get("components") or [{}])[0]).get("component_id") if ens.get("components") else None,
              })
              for x in d.get("community_trials") or []:
                  z=indicator_stats.setdefault(x["indicator_id"], {"tested":0,"validated":0,"scores":[]})
                  z["tested"]+=1
                  if x.get("validated"):
                      z["validated"]+=1
                      z["scores"].append(float(x.get("robust_score") or 0))
              for x in d.get("native_trials") or []:
                  t=x["trial"]
                  key=t["strategy_id"]
                  z=native_stats.setdefault(key, {"tested":0,"validated":0,"scores":[]})
                  z["tested"]+=1
                  score=0.0
                  for component in ens.get("components") or []:
                      if component.get("source_type")=="core_strategy" and component.get("component_id")==key:
                          score=float(component.get("raw_score") or 0)
                  if score>0:
                      z["validated"]+=1
                      z["scores"].append(score)

          summary={
              "symbol_count": len(rows),
              "symbols": rows,
              "community_leaderboard": sorted([
                  {
                      "indicator_id": k,
                      "tested": v["tested"],
                      "validated": v["validated"],
                      "validation_rate": v["validated"]/v["tested"] if v["tested"] else 0,
                      "avg_validated_score": sum(v["scores"])/len(v["scores"]) if v["scores"] else 0,
                  }
                  for k,v in indicator_stats.items()
              ], key=lambda x:(x["validated"],x["avg_validated_score"]), reverse=True),
              "native_leaderboard": sorted([
                  {
                      "strategy_id": k,
                      "tested": v["tested"],
                      "validated": v["validated"],
                      "validation_rate": v["validated"]/v["tested"] if v["tested"] else 0,
                      "avg_validated_score": sum(v["scores"])/len(v["scores"]) if v["scores"] else 0,
                  }
                  for k,v in native_stats.items()
              ], key=lambda x:(x["validated"],x["avg_validated_score"]), reverse=True),
          }
          Path("research_native_outputs/combined_summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True))
          print("STC_NATIVE_COMMUNITY_SUMMARY="+json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stc-native-community-15m-combined-${{ github.run_id }}
          path: research_native_outputs/*.json
          if-no-files-found: error
          retention-days: 14
