name: STC Owner Approval Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stc-owner-approval-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STC_OWNER_TOKEN: ${{ secrets.STC_OWNER_TOKEN }}
      STC_WORKER_TOKEN: ${{ secrets.STC_WORKER_TOKEN }}
      BRIDGE_URL: https://stc.feama.site
      EVENT_ID: stc-capital-e2e-manual-20260921-001
    steps:
      - name: Require owner secret without exposing it
        run: |
          set -euo pipefail
          if [ -z "$STC_OWNER_TOKEN" ]; then
            echo "STC_OWNER_TOKEN GitHub Actions secret is not configured." >&2
            exit 2
          fi

      - name: Verify owner approval write is blocked by runtime controls
        run: |
          set -euo pipefail
          inbox="$(curl --fail-with-body -sS -H "Authorization: Bearer $STC_WORKER_TOKEN" "$BRIDGE_URL/inbox.php?status=ingested&limit=100")"
          signal_id="$(printf '%s' "$inbox" | jq -r --arg id "$EVENT_ID" '
            [.events[]? | select(.event_id == $id)][0].result.decision.signal.signal_id // empty
          ')"
          test -n "$signal_id"

          before="$(curl --fail-with-body -sS -H "Authorization: Bearer $STC_WORKER_TOKEN" "$BRIDGE_URL/runtime_control.php")"
          printf '%s' "$before" | jq -e '
            .runtime_control.safe_mode == true
            and .runtime_control.kill_switch == true
          ' >/dev/null

          code="$(curl -sS -o /tmp/owner-approval.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $STC_OWNER_TOKEN"             -H "Content-Type: application/json"             --data '{"signal_id":"'"$signal_id"'","decision":"approve","note":"production-safety-gate"}'             "$BRIDGE_URL/approval.php")"

          test "$code" = "409"
          jq -e '
            .ok == true
            and .approved == false
            and .decision == "blocked"
            and .execution == "manual_only"
            and (.reasons | index("safe_mode_active") != null)
            and (.reasons | index("kill_switch_active") != null)
            and (.reasons | index("wait_is_not_an_order") != null)
          ' /tmp/owner-approval.json >/dev/null

          readback="$(curl --fail-with-body -sS -H "Authorization: Bearer $STC_OWNER_TOKEN" --get --data-urlencode "signal_id=$signal_id" "$BRIDGE_URL/approval.php")"
          printf '%s' "$readback" | jq -e '
            .ok == true
            and .approval.decision == "blocked"
            and .runtime_control.safe_mode == true
            and .runtime_control.kill_switch == true
            and .execution == "manual_only"
          ' >/dev/null

          printf '%s' "$readback" | jq '{
            owner_write_path: "verified_blocked",
            signal_id,
            approval_decision: .approval.decision,
            runtime_control: {
              safe_mode: .runtime_control.safe_mode,
              kill_switch: .runtime_control.kill_switch,
              version: .runtime_control.version
            },
            execution
          }'
