name: STC Capital Signal Readback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stc-capital-signal-readback-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STC_WORKER_TOKEN: ${{ secrets.STC_WORKER_TOKEN }}
      BRIDGE_URL: https://stc.feama.site
      EVENT_ID: stc-capital-e2e-manual-20260921-001
    steps:
      - name: Verify persisted Capital.com signal and approval read path
        run: |
          set -euo pipefail
          inbox="$(curl --fail-with-body -sS -H "Authorization: Bearer $STC_WORKER_TOKEN" "$BRIDGE_URL/inbox.php?status=ingested&limit=100")"
          event="$(printf '%s' "$inbox" | jq -c --arg id "$EVENT_ID" '[.events[]? | select(.event_id == $id)][0] // empty')"
          test -n "$event"
          printf '%s' "$event" | jq -e '
            .status == "ingested"
            and .result.status == "analyzed"
            and .result.decision.action == "signal_created"
            and .result.decision.execution == "manual_approval_required"
            and .result.receipt.execution == "manual_only"
            and (.result.decision.signal.signal_id | type == "string")
          ' >/dev/null
          signal_id="$(printf '%s' "$event" | jq -r '.result.decision.signal.signal_id')"
          response="$(curl --fail-with-body -sS -H "Authorization: Bearer $STC_WORKER_TOKEN" --get --data-urlencode "signal_id=$signal_id" "$BRIDGE_URL/approval.php")"
          printf '%s' "$response" | jq -e '
            .ok == true
            and .signal_id != null
            and .execution == "manual_only"
            and .runtime_control.safe_mode == true
            and .runtime_control.kill_switch == true
          ' >/dev/null
          code="$(curl -sS -o /tmp/write.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $STC_WORKER_TOKEN"             -H "Content-Type: application/json"             --data '{"signal_id":"'"$signal_id"'","decision":"reject","note":"worker-boundary-test"}'             "$BRIDGE_URL/approval.php")"
          test "$code" = "401"
          printf '%s' "$event" | jq '{
            event_id,
            signal_id: .result.decision.signal.signal_id,
            recommendation: .result.decision.signal.recommendation,
            composite_score: .result.decision.signal.composite_score,
            receipt_id: .result.receipt.receipt_id,
            envelope_valid_until: .result.decision.approval_envelope.valid_until,
            execution: .result.receipt.execution
          }'
          printf '%s' "$response" | jq '{
            approval_read_ok: .ok,
            has_prior_approval: (.approval != null),
            runtime_control: {
              safe_mode: .runtime_control.safe_mode,
              kill_switch: .runtime_control.kill_switch,
              version: .runtime_control.version
            },
            execution
          }'
          runtime_code="$(curl -sS -o /tmp/runtime-write.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $STC_WORKER_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"safe_mode":false,"kill_switch":false,"reason":"worker-boundary-test"}' \
            "$BRIDGE_URL/runtime_control.php")"
          test "$runtime_code" = "401"
          verify="$(curl --fail-with-body -sS -H "Authorization: Bearer $STC_WORKER_TOKEN" "$BRIDGE_URL/runtime_control.php")"
          printf '%s' "$verify" | jq -e '.runtime_control.safe_mode == true and .runtime_control.kill_switch == true and .runtime_control.version == 1' >/dev/null
          echo '{"worker_approval_write_boundary":"verified_401","worker_runtime_write_boundary":"verified_401","runtime_controls_unchanged":true}'
