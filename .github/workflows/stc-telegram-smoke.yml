name: STC Telegram Smoke

on:
  push:
    branches: [main]
    paths:
      - "ops/TELEGRAM_SMOKE_TRIGGER"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      STC_OWNER_TOKEN: ${{ secrets.STC_OWNER_TOKEN }}
    steps:
      - name: Send Telegram smoke test through production notification endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STC_OWNER_TOKEN:-}"
          curl -fsS --retry 2 --max-time 20 \
            -X POST \
            -H "Authorization: Bearer ${STC_OWNER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"action":"test"}' \
            "https://stc.feama.site/notification.php" | tee /tmp/stc_telegram_smoke.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/stc_telegram_smoke.json", encoding="utf-8"))
          dispatch=data.get("dispatch") or {}
          channels=dispatch.get("channels") or {}
          tg=channels.get("telegram") or {}
          if data.get("ok") is not True or dispatch.get("delivered_any") is not True or tg.get("ok") is not True:
              raise SystemExit("telegram_smoke_failed")
          print("STC_TELEGRAM_SMOKE=SUCCESS")
          PY
