name: STC R9 Source Inspection
on:
  push:
    branches: [stc-r9-data-exit-audit-20260927]
    paths: [.github/workflows/stc-r9-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd55750821131aff446eb7bf2f2c88cd518251e2
          persist-credentials: false
      - run: git archive --format=zip HEAD -o /tmp/stc-r9-main.zip
      - uses: actions/checkout@v4
        with:
          ref: 50d4b9ee8f481711a7ace66707621bc633b210d9
          persist-credentials: false
      - run: git archive --format=zip HEAD -o /tmp/stc-r9-research.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stc-r9-source
          path: /tmp/stc-r9-*.zip
          retention-days: 3
