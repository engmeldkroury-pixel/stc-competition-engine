name: STC Research Pilot

on:
  push:
    branches:
      - "research/**"
    paths:
      - "research_inputs/**"

permissions:
  contents: read

concurrency:
  group: stc-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover research inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find research_inputs -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No research input directories found."
            exit 1
          fi
          printf '%s\n' "${dirs[@]}" > /tmp/stc-research-dirs.txt
          echo "count=${#dirs[@]}" >> "$GITHUB_OUTPUT"
          cat /tmp/stc-research-dirs.txt

      - name: Run no-lookahead research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_outputs
          while IFS= read -r dir; do
            name="$(basename "$dir")"
            echo "::group::Research $name"
            python scripts/run_strategy_research_dir.py "$dir" --output "research_outputs/${name}.json"
            echo "::endgroup::"
          done < /tmp/stc-research-dirs.txt

      - name: Print compact results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("research_outputs").glob("*.json")):
              data = json.loads(path.read_text())
              report = data["research_report"]
              p = report.get("setup_probability") or {}
              live = data.get("live_entry_research_report") or {}
              live_p = live.get("setup_probability") or {}
              print("STC_RESEARCH_SUMMARY=" + json.dumps({
                  "symbol": data["symbol"],
                  "status": report["status"],
                  "strategy": report.get("selected_strategy"),
                  "timeframe": report.get("selected_timeframe"),
                  "robust_score": report.get("robust_score"),
                  "test_trades": report.get("test_trades"),
                  "forward_trades": report.get("forward_trades"),
                  "test_expectancy_r": report.get("test_expectancy_r"),
                  "forward_expectancy_r": report.get("forward_expectancy_r"),
                  "test_profit_factor": report.get("test_profit_factor"),
                  "forward_profit_factor": report.get("forward_profit_factor"),
                  "probability_status": p.get("status"),
                  "estimated_probability": p.get("estimated_win_probability"),
                  "probability_sample_size": p.get("sample_size"),
                  "deployable_features": report.get("deployable_feature_count"),
                  "live_entry_timeframe": data.get("live_entry_timeframe"),
                  "live_entry_status": live.get("status"),
                  "live_entry_strategy": live.get("selected_strategy"),
                  "live_entry_robust_score": live.get("robust_score"),
                  "live_entry_probability_status": live_p.get("status"),
                  "live_entry_estimated_probability": live_p.get("estimated_win_probability"),
                  "live_entry_probability_sample_size": live_p.get("sample_size"),
                  "live_entry_deployable_features": live.get("deployable_feature_count"),
              }, sort_keys=True))
              trials = sorted(
                  data.get("strategy_trials") or [],
                  key=lambda row: (
                      float(row.get("robust_score") or 0.0),
                      float((row.get("test") or {}).get("expectancy_r") or 0.0),
                      float((row.get("test") or {}).get("profit_factor") or 0.0),
                  ),
                  reverse=True,
              )[:8]
              for row in trials:
                  trial = row.get("trial") or {}
                  test = row.get("test") or {}
                  forward = row.get("forward") or {}
                  print("STC_TRIAL_DIAGNOSTIC=" + json.dumps({
                      "symbol": data["symbol"],
                      "strategy": trial.get("strategy_id"),
                      "timeframe": trial.get("timeframe"),
                      "robust_score": row.get("robust_score"),
                      "research_class": row.get("research_class"),
                      "rejection_reasons": row.get("rejection_reasons"),
                      "test_trades": test.get("trades"),
                      "test_expectancy_r": test.get("expectancy_r"),
                      "test_profit_factor": test.get("profit_factor"),
                      "test_win_rate": test.get("win_rate"),
                      "forward_trades": forward.get("trades"),
                      "forward_expectancy_r": forward.get("expectancy_r"),
                      "forward_profit_factor": forward.get("profit_factor"),
                      "max_drawdown_r": trial.get("max_drawdown_r"),
                  }, sort_keys=True))

              all_trials = data.get("strategy_trials") or []
              timeframe_keys = sorted(
                  {str((row.get("trial") or {}).get("timeframe")) for row in all_trials},
                  key=lambda x: (x == "1D", int(x) if x.isdigit() else 999999),
              )
              for timeframe in timeframe_keys:
                  rows = [
                      row for row in all_trials
                      if str((row.get("trial") or {}).get("timeframe")) == timeframe
                  ]
                  if not rows:
                      continue
                  best = max(
                      rows,
                      key=lambda row: (
                          float(row.get("robust_score") or 0.0),
                          float((row.get("test") or {}).get("expectancy_r") or -999.0),
                          float((row.get("forward") or {}).get("expectancy_r") or -999.0),
                      ),
                  )
                  trial = best.get("trial") or {}
                  test = best.get("test") or {}
                  forward = best.get("forward") or {}
                  print("STC_TIMEFRAME_DIAGNOSTIC=" + json.dumps({
                      "symbol": data["symbol"],
                      "timeframe": timeframe,
                      "coverage_days": (data.get("derived_timeframe_span_days") or {}).get(timeframe),
                      "bars": (data.get("derived_timeframes") or {}).get(timeframe),
                      "selection_status": (data.get("timeframe_selections") or {}).get(timeframe, {}).get("status"),
                      "selected_strategy": (data.get("timeframe_selections") or {}).get(timeframe, {}).get("strategy_id"),
                      "best_candidate_strategy": trial.get("strategy_id"),
                      "robust_score": best.get("robust_score"),
                      "research_class": best.get("research_class"),
                      "rejection_reasons": best.get("rejection_reasons"),
                      "test_trades": test.get("trades"),
                      "test_expectancy_r": test.get("expectancy_r"),
                      "test_profit_factor": test.get("profit_factor"),
                      "forward_trades": forward.get("trades"),
                      "forward_expectancy_r": forward.get("expectancy_r"),
                      "forward_profit_factor": forward.get("profit_factor"),
                  }, sort_keys=True))
          PY

      - name: Print calibration candidates
        shell: bash
        run: |
          set -euo pipefail
          for path in research_outputs/*.json; do
            python scripts/print_calibration_candidate.py "$path"
            python scripts/print_calibration_candidate.py "$path" --overall
          done

      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: stc-research-${{ github.run_id }}
          path: research_outputs/*.json
          if-no-files-found: error
          retention-days: 7
