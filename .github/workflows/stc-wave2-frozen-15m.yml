name: STC Wave2 Frozen 15m Confirmation

on:
  push:
    branches:
      - "research/wave2-frozen-15m-*"
    paths:
      - "research_wave2/READY"

permissions:
  contents: read

concurrency:
  group: stc-wave2-frozen-15m-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.matrix.outputs.dirs }}
    steps:
      - name: Checkout current research code
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout exact-provider 15m dataset branch
        uses: actions/checkout@v4
        with:
          ref: research/native-community-15m-20260923
          path: exact-data

      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          dirs="$(find exact-data/research_native_inputs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Exact-data symbol directories: $(echo "$dirs" | jq length)"

  confirm:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    steps:
      - name: Checkout current research code
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout exact-provider 15m dataset branch
        uses: actions/checkout@v4
        with:
          ref: research/native-community-15m-20260923
          path: exact-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install dependencies
        run: pip install -r code/requirements.txt

      - name: Run exact frozen confirmation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_wave2_outputs
          python code/scripts/run_community_frozen_confirmation.py             "exact-data/research_native_inputs/${{ matrix.dir }}"             --output "research_wave2_outputs/${{ matrix.dir }}.json"

      - name: Upload symbol result
        uses: actions/upload-artifact@v4
        with:
          name: stc-wave2-frozen-${{ matrix.dir }}
          path: research_wave2_outputs/*.json
          if-no-files-found: error
          retention-days: 14

  combine:
    needs: confirm
    if: always() && needs.confirm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stc-wave2-frozen-*
          merge-multiple: true
          path: research_wave2_outputs

      - name: Build expanded frozen summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          symbols=[]
          passes=Counter()
          new_ids={"trendilo","halftrend_everget","nadaraya_watson_endpoint_nonrepaint"}
          new_survivors=[]
          for path in sorted(Path("research_wave2_outputs").glob("*.json")):
              d=json.loads(path.read_text())
              r=d["report"]
              candidates=list(r.get("promotion_candidates") or [])
              for item in candidates:
                  passes[item]+=1
              new_here=sorted(set(candidates)&new_ids)
              if new_here:
                  new_survivors.append({"symbol":d["symbol"],"components":new_here})
              symbols.append({
                  "symbol":d["symbol"],
                  "status":r["status"],
                  "development_bars":r["development_bars"],
                  "confirmation_bars":r["confirmation_bars"],
                  "promotion_candidates":candidates,
                  "wave2_candidates":new_here,
              })
          summary={
              "schema":"stc-wave2-frozen-15m-v1",
              "symbol_count":len(symbols),
              "symbols_with_any_frozen_pass":sum(bool(x["promotion_candidates"]) for x in symbols),
              "symbols_with_wave2_frozen_pass":len(new_survivors),
              "component_pass_counts":dict(sorted(passes.items())),
              "wave2_survivors":new_survivors,
              "symbols":symbols,
              "live_authority":False,
              "data_source":"TradingView exact-provider 5000-bar datasets captured in research/native-community-15m-20260923",
              "method":"85% development with internal train/test/forward; final 15% untouched frozen confirmation",
          }
          Path("research_wave2_outputs/combined_wave2_frozen_summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )
          print("STC_WAVE2_FROZEN_SUMMARY="+json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stc-wave2-frozen-combined-${{ github.run_id }}
          path: research_wave2_outputs/*.json
          if-no-files-found: error
          retention-days: 14
