name: STC Process Bridge Events

on:
  repository_dispatch:
    types: [stc_event]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stc-bridge-processor
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STC_BRIDGE_URL: https://stc.feama.site
      STC_WORKER_TOKEN: ${{ secrets.STC_WORKER_TOKEN }}
      STC_WORKER_ID: stc-github-worker
      STC_WORKER_BATCH_LIMIT: "20"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Process pending STC bridge events
        run: python run_bridge_worker_once.py
